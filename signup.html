<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossed Classic — Sign up</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="./api-config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black:#0a0a0a; --off-white:#f0ede6; --gold:#b8952a; --accent:#c8a951; }
    body{ background:var(--black); color:var(--off-white); font-family:'Cormorant Garamond',serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; overflow-x:hidden; }
    .card{ width:100%; max-width:520px; background:rgba(17,17,17,0.7); border:1px solid rgba(180,149,42,0.2); border-radius:20px; padding:2.2rem 2rem; position:relative; }
    .brand{ display:flex; gap:0.9rem; align-items:center; margin-bottom:1rem; }
    .brand img{ width:42px; height:42px; border-radius:50%; object-fit:cover; }
    .brand span{ font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:0.06em; color:var(--accent); }
    h1{ font-family:'Bebas Neue',sans-serif; font-size:2.4rem; letter-spacing:0.04em; margin-bottom:0.6rem; }
    .sub{ color:rgba(240,237,230,0.6); font-style:italic; margin-bottom:1.2rem; line-height:1.8; }
    .field{ margin-bottom:1rem; }
    .field label{ display:block; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:rgba(240,237,230,0.45); margin-bottom:0.55rem; }
    .field input{ width:100%; min-height:48px; border:1px solid rgba(180,149,42,0.25); background:rgba(10,10,10,0.75); color:var(--off-white); padding:0.8rem 0.95rem; font-family:'Space Mono',monospace; font-size:0.75rem; outline:none; }
    .field input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(200,169,81,0.15); }
    .actions{ display:grid; gap:0.75rem; margin-top:1.4rem; }
    button{ min-height:52px; border:1px solid var(--gold); font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.26em; text-transform:uppercase; cursor:pointer; background:transparent; color:var(--accent); border-radius:12px; }
    button.primary{ background:var(--gold); color:#0a0a0a; }
    .muted{ color:rgba(240,237,230,0.55); font-size:0.95rem; margin-top:1rem; }
    .muted a{ color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(200,169,81,0.35); }
    .alert{ display:none; margin-top:1rem; padding:0.95rem 1rem; border-radius:12px; border:1px solid rgba(200,169,81,0.25); background:rgba(200,169,81,0.08); color:rgba(240,237,230,0.8); font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; }

    .page-loader { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; padding: 1rem; z-index: 9999; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; }
    .page-loader.active { opacity: 1; visibility: visible; }
    .page-loader .loader-box { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 1.4rem 1.6rem; border-radius: 18px; background: rgba(17, 17, 17, 0.96); border: 1px solid rgba(200,169,81,0.2); }
    .page-loader .loader-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); animation: loaderPulse 0.8s ease-in-out infinite alternate; }
    @keyframes loaderPulse { to { transform: scale(1.4); opacity: 0.6; } }
  </style>
</head>
<body>
  <form class="card" id="signupForm" autocomplete="off">
    <div class="brand">
      <img alt="Crossed Classic" src="./logo.png" />
      <span>Crossed Classic</span>
    </div>
    <h1>Sign up</h1>
    <p class="sub">Create your account to track your orders.</p>

    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" placeholder="Your name" autocomplete="name" />
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" placeholder="+234 800 000 0000" autocomplete="tel" />
    </div>

    <div class="field">
      <label for="address">Address</label>
      <input id="address" name="address" placeholder="Street, city, country" autocomplete="street-address" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="new-password" minlength="6" />
    </div>

    <div class="actions">
      <button class="primary" type="submit">Create account</button>
      <button type="button" onclick="location.href='./login.html'">I already have an account</button>
    </div>

    <div class="alert" id="alert" role="status" aria-live="polite"></div>
    <p class="muted"><a href="./index.html">← Back to Home</a></p>
  </form>

  <div class="page-loader" id="pageLoader">
    <div class="loader-box">
      <div class="loader-dot" aria-hidden="true"></div>
      <div id="loaderMessage">Loading…</div>
    </div>
  </div>

  <script>
    const API_BASE = (() => {
      const localFrontend = ['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '8000';
      return window.CROSSED_CLASSIC_API_BASE || (location.protocol === 'file:' || localFrontend ? 'http://localhost:8000' : '');
    })();
    const form = document.getElementById('signupForm');
    const alertEl = document.getElementById('alert');
    const pageLoader = document.getElementById('pageLoader');

    function showAlert(msg){
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
    }
    function showLoader(msg = 'Loading…') {
      if (!pageLoader) return;
      pageLoader.querySelector('#loaderMessage').textContent = msg;
      pageLoader.classList.add('active');
    }
    function hideLoader() {
      if (!pageLoader) return;
      pageLoader.classList.remove('active');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      showLoader('Creating account…');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();

      try {
        const res = await fetch(`${API_BASE}/api/auth/signup`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name, phone, address }),
        });

        const text = await res.text().catch(() => '');
        const data = (() => {
          try { return text ? JSON.parse(text) : {}; } catch { return {}; }
        })();
        if (!res.ok) throw new Error(data?.error || text || 'Signup failed');


        // session cookie is set by backend
        location.href = './index.html';

      } catch (err) {
        showAlert(String(err.message || err));
      } finally {
        hideLoader();
      }
    });
  </script>
</body>
</html>
